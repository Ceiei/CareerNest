<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career OS · 本地填写演练</title>
<style>body{font:16px/1.6 system-ui;color:#293441;background:#f7f6f2;max-width:720px;margin:40px auto;padding:24px}fieldset{border:1px solid #d8dce1;background:white;padding:24px;margin:24px 0}label{display:block;margin:14px 0}input,select,textarea{display:block;box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #bfc9d4;border-radius:5px}button{padding:10px 16px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>本地填写演练</h1>
<p>先在 App 中保存资料并配对插件，再点击插件“扫描当前页面”并确认填写。本页仅模拟申请表，不提交数据，也不保存为个人资料。</p>
<form onsubmit="return false">
<fieldset><legend>基本信息</legend>
<label>姓名<input name="fullName" autocomplete="name"></label>
<label>手机号<input name="phone" type="tel"></label>
<label>电子邮箱<input name="email" type="email"></label>
<label>性别<select name="gender"><option value="">请选择</option><option>男</option><option>女</option></select></label>
</fieldset>
<fieldset><legend>教育经历</legend>
<label>学校<input name="school"></label>
<label>专业<input name="major"></label>
<label>学历<select name="degree"><option value="">请选择</option><option>本科</option><option>硕士研究生</option><option>博士研究生</option></select></label>
<label>学位<select name="academicDegree"><option value="">请选择</option><option>学士学位</option><option>硕士学位</option><option>博士学位</option></select></label>
</fieldset>
<button type="button" id="inspect">查看填写结果（不提交）</button>
</form><pre id="result"></pre>
<script>document.getElementById('inspect').onclick=()=>{document.getElementById('result').textContent=JSON.stringify(Object.fromEntries([...document.querySelectorAll('input,select')].map(e=>[e.name,e.value])),null,2);};</script>
</html>
