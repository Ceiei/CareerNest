<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><title>高校申请表单测试样本</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:32px auto;color:#1d2b23}fieldset{margin:20px 0;padding:20px;border:1px solid #cbd8d0;border-radius:10px}label{display:block;margin:12px 0}input,select,textarea,[contenteditable]{display:block;width:100%;padding:8px;margin-top:5px;box-sizing:border-box}.inline{display:inline;width:auto}.custom-select{position:relative}.options{display:none;position:absolute;background:#fff;border:1px solid #aaa;width:100%;z-index:2}.custom-select.open .options{display:block}[role=option]{padding:8px;cursor:pointer}#result{white-space:pre-wrap;background:#eef4f0;padding:12px}</style>
</head>
<body>
  <h1>高校夏令营申请表</h1>
  <p>本页仅用于本地扩展测试，不会上传或提交任何数据。</p>
  <form id="application">
    <fieldset><legend>基本信息</legend>
      <label for="full-name">真实姓名</label><input id="full-name" autocomplete="name" required>
      <label>联系电话<input name="mobile" type="tel" placeholder="11位手机号"></label>
      <label>电子邮箱<input name="emailAddress" type="email"></label>
      <label>出生日期<input name="birthday" type="date"></label>
      <label>性别 <input class="inline" type="radio" name="gender" value="M">男 <input class="inline" type="radio" name="gender" value="F">女</label>
      <label>政治面貌<select name="political_status"><option value="">请选择</option><option value="member">中共党员</option><option value="league">共青团员</option><option value="public">群众</option></select></label>
      <label>是否服从调剂 <input class="inline" type="radio" name="adjustment" value="yes">是 <input class="inline" type="radio" name="adjustment" value="no">否</label>
      <label>报名编号（已有值，不应覆盖）<input name="application_id" value="EXISTING-001"></label>
    </fieldset>
    <fieldset><legend>教育经历</legend>
      <label>毕业院校<input name="school"></label>
      <label>主修专业<input name="major"></label>
      <label>最高学历<select name="degree"><option value="">请选择</option><option value="bachelor">本科生</option><option value="master">硕士研究生</option></select></label>
      <label>平均绩点<input name="gpa" type="number" step="0.01"></label>
      <label>专业排名<input name="ranking"></label>
    </fieldset>
    <fieldset><legend>科研信息</legend>
      <label>研究方向<input name="research_area"></label>
      <label>科研计划<textarea name="research_plan" maxlength="500"></textarea></label>
      <label>补充说明<div contenteditable="true" role="textbox" aria-label="补充说明"></div></label>
    </fieldset>
    <button type="button" id="engine-run">运行规则引擎端到端测试</button>
    <button type="button" id="inspect">查看当前值（不会提交）</button>
  </form>
  <pre id="result">尚未检查</pre>
  <script>
    document.querySelector('#inspect').addEventListener('click',()=>{
      const data={}; document.querySelectorAll('input,select,textarea,[contenteditable]').forEach(el=>{const key=el.name||el.getAttribute('aria-label')||el.id;if(el.type==='radio'){if(el.checked)data[key]=el.value}else data[key]=el.value??el.textContent}); document.querySelector('#result').textContent=JSON.stringify(data,null,2)
    });
  </script>
  <script type="module" src="./harness.ts"></script>
</body>
</html>
