name: Desktop demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run demo:setup
      - run: npm run compile
      - run: npm test
      - run: npm run test:service
      - run: npm run test:desktop
      - run: npm run demo:pack
      - uses: actions/upload-artifact@v4
        with:
          name: source-demo-${{ matrix.os }}
          path: release/*
